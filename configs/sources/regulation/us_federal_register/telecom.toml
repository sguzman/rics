[source]
key = "regulation.us_federal_register.telecom"
name = "US Federal Register: Telecom"
domain = "regulation"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/regulation/us_federal_register/telecom.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "regulatory_event"
subtype = "rulemaking_window"
status = "scheduled"
categories = ["regulation", "federal_register", "united_states", "official", "telecom"]
importance = 88

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-federal-register-telecom-{{year}}.ics"
