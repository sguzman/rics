[source]
key = "health.us.fda"
name = "US Public Health: FDA"
domain = "health"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/health/us_public_health/fda.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "health_event"
subtype = "advisory_committee"
status = "scheduled"
categories = ["health", "united_states", "official", "fda"]
importance = 86

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-public-health-fda-{{year}}.ics"
