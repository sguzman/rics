[source]
key = "card_games.yugioh_tcg"
name = "Yu-Gi-Oh! TCG Organized Play"
domain = "card_games"
enabled = true
timezone = "UTC"
jurisdiction = "GLOBAL"

[fetch]
mode = "file"
file_path = "../../../../data/sources/card_games/competitive/yugioh_tcg.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "date"
formats = ["%Y-%m-%d", "%Y"]
assume_timezone = "UTC"
allow_month_only = true
allow_year_only = true

[event]
event_type = "card_game_event"
status = "scheduled"
categories = ["card_games", "competitive", "yugioh_tcg", "tabletop"]
importance = 88

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "card-games-yugioh-tcg-{{year}}.ics"
