[source]
key = "transit.us.los_angeles"
name = "US Transit: LA Metro"
domain = "transit"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/transit/us_major/los_angeles.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "transit_event"
subtype = "board_meeting"
status = "scheduled"
categories = ["transit", "united_states", "official", "los_angeles"]
importance = 78

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-transit-los-angeles-{{year}}.ics"
