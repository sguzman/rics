[source]
key = "grants.us.grants_gov"
name = "US Public Funding: Grants.gov"
domain = "grants"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/grants/us_public_funding/grants_gov.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "grant_event"
subtype = "grant_deadline"
status = "scheduled"
categories = ["grants", "united_states", "official", "grants_gov"]
importance = 80

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-public-funding-grants-gov-{{year}}.ics"
