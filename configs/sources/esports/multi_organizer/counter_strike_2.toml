allow_month_only = true
allow_year_only = true

[event]
event_type = "esports_event"
status = "scheduled"
categories = ["esports", "multi_organizer", "counter_strike_2"]
importance = 91

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "esports-counter-strike-2-{{year}}.ics"
