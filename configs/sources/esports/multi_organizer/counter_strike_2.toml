[source]
key = "esports.multi_organizer.counter_strike_2"
name = "Counter-Strike 2"
domain = "esports"
enabled = true
timezone = "UTC"

[fetch]
mode = "file"
file_path = "../../../../data/sources/esports/multi_organizer/counter_strike_2.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "date"
formats = ["%Y-%m-%d", "%Y"]
