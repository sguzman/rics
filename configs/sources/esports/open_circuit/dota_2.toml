[source]
key = "esports.open_circuit.dota_2"
name = "Dota 2 Esports"
domain = "esports"
enabled = true
timezone = "UTC"

[fetch]
mode = "file"
file_path = "../../../../data/sources/esports/open_circuit/dota_2.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "date"
formats = ["%Y-%m-%d", "%Y"]
assume_timezone = "UTC"
allow_month_only = true
allow_year_only = true

[event]
event_type = "esports_event"
status = "scheduled"
categories = ["esports", "open_circuit", "dota_2"]
importance = 88

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "esports-dota-2-{{year}}.ics"
