[source]
key = "sports.golf.korn_ferry"
name = "Korn Ferry Tour"
domain = "sports"
enabled = true
timezone = "UTC"
jurisdiction = "GLOBAL"

[fetch]
mode = "http"
base_url = "https://www.pgatour.com/korn-ferry-tour/schedule/2026"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
timeout_secs = 60
retry_attempts = 2
retry_backoff_ms = 250

[extract]
format = "html"

[date]
primary = "date"
formats = ["%Y-%m-%d", "%Y"]
assume_timezone = "UTC"
allow_month_only = true
allow_year_only = true

[event]
event_type = "sports_event"
status = "scheduled"
categories = ["sports", "golf", "mens", "korn_ferry"]
importance = 76

[custom]
enabled = true
parser = "pgatour_schedule_next_data_v1"

[publish]
file_name_template = "us-mens-golf-korn-ferry-{{year}}.ics"
