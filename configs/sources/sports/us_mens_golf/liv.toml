[source]
key = "sports.golf.liv"
name = "LIV Golf"
domain = "sports"
enabled = true
timezone = "UTC"
jurisdiction = "GLOBAL"

[fetch]
mode = "file"
file_path = "../../../../data/sources/sports/us_mens_golf/liv.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "date"
formats = ["%Y-%m-%d", "%Y"]
assume_timezone = "UTC"
allow_month_only = true
allow_year_only = true

[event]
event_type = "sports_event"
status = "scheduled"
categories = ["sports", "golf", "mens", "liv"]
importance = 80

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-mens-golf-liv-{{year}}.ics"
