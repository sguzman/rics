[source]
key = "weather.us.noaa.hurricane"
name = "US NOAA: NOAA Hurricane Products"
domain = "weather"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/weather/us_noaa/hurricane.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "weather_event"
subtype = "storm_product_window"
status = "scheduled"
categories = ["weather", "noaa", "united_states", "official", "hurricane"]
importance = 84

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-noaa-hurricane-{{year}}.ics"
