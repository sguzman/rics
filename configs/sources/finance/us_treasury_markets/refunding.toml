[source]
key = "finance.us_treasury_markets.refunding"
name = "US Treasury Markets: Quarterly Refunding"
domain = "finance"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/finance/us_treasury_markets/refunding.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d %I:%M %p", "%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "finance_event"
subtype = "treasury_markets"
status = "scheduled"
categories = ["finance", "treasury", "debt_management", "united_states", "official"]
importance = 90

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-treasury-refunding-{{year}}.ics"
