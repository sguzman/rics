[source]
key = "finance.us_sec_edgar.filing_deadlines"
name = "US SEC/EDGAR Filing Deadlines"
domain = "finance"
enabled = true
timezone = "America/New_York"
jurisdiction = "US"
default_country = "US"

[fetch]
mode = "file"
file_path = "../../../../data/sources/finance/us_sec_edgar/filing_deadlines.txt"
timeout_secs = 10
retry_attempts = 1
retry_backoff_ms = 10

[extract]
format = "text"

[date]
primary = "start"
formats = ["%Y-%m-%d", "%Y"]
assume_timezone = "America/New_York"
allow_month_only = true
allow_year_only = true

[event]
event_type = "finance_event"
subtype = "sec_filing_deadline"
status = "scheduled"
categories = ["finance", "sec", "edgar", "filings", "united_states", "official"]
importance = 85

[custom]
enabled = true
parser = "structured_calendar_feed_v1"

[publish]
file_name_template = "us-sec-edgar-deadlines-{{year}}.ics"
